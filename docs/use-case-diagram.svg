<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">
    Contact Manager — Use Case Diagram
  </text>

  <!-- System boundary -->
  <rect x="230" y="70" width="440" height="500" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="450" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">
    Contact Manager System
  </text>

  <!-- Use case ovals -->
  <g font-size="13" fill="#1e293b">
    <ellipse cx="450" cy="140" rx="120" ry="30" fill="#c2410c" stroke="#9a3412" stroke-width="1.5"/>
    <text x="450" y="145" text-anchor="middle" fill="#ffffff" font-weight="600">Register</text>

    <ellipse cx="450" cy="210" rx="120" ry="30" fill="#c2410c" stroke="#9a3412" stroke-width="1.5"/>
    <text x="450" y="215" text-anchor="middle" fill="#ffffff" font-weight="600">Login</text>

    <ellipse cx="450" cy="280" rx="120" ry="30" fill="#475569" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="285" text-anchor="middle" fill="#ffffff" font-weight="600">Logout</text>

    <ellipse cx="450" cy="360" rx="120" ry="30" fill="#15803d" stroke="#166534" stroke-width="1.5"/>
    <text x="450" y="365" text-anchor="middle" fill="#ffffff" font-weight="600">Add Contact</text>

    <ellipse cx="450" cy="430" rx="120" ry="30" fill="#15803d" stroke="#166534" stroke-width="1.5"/>
    <text x="450" y="435" text-anchor="middle" fill="#ffffff" font-weight="600">Edit Contact</text>

    <ellipse cx="450" cy="500" rx="120" ry="30" fill="#15803d" stroke="#166534" stroke-width="1.5"/>
    <text x="450" y="505" text-anchor="middle" fill="#ffffff" font-weight="600">Delete Contact</text>

    <ellipse cx="450" cy="570" rx="120" ry="30" fill="#0891b2" stroke="#155e75" stroke-width="1.5"/>
    <text x="450" y="575" text-anchor="middle" fill="#ffffff" font-weight="600">Search Contact</text>
  </g>

  <!-- User actor (left) -->
  <g stroke="#1e293b" stroke-width="2" fill="none">
    <circle cx="70" cy="290" r="14" fill="#f8fafc"/>
    <line x1="70" y1="304" x2="70" y2="350"/>
    <line x1="42" y1="322" x2="98" y2="322"/>
    <line x1="70" y1="350" x2="48" y2="385"/>
    <line x1="70" y1="350" x2="92" y2="385"/>
  </g>
  <text x="70" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">User</text>

  <!-- System actor (right) representing session/auth enforcement -->
  <g stroke="#1e293b" stroke-width="2" fill="none">
    <circle cx="830" cy="290" r="14" fill="#f8fafc"/>
    <line x1="830" y1="304" x2="830" y2="350"/>
    <line x1="802" y1="322" x2="858" y2="322"/>
    <line x1="830" y1="350" x2="808" y2="385"/>
    <line x1="830" y1="350" x2="852" y2="385"/>
  </g>
  <text x="830" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">System</text>
  <text x="830" y="422" text-anchor="middle" font-size="10" fill="#64748b">(session check)</text>

  <!-- User associations: straight lines to every use case -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="98" y1="300" x2="330" y2="140"/>
    <line x1="98" y1="305" x2="330" y2="210"/>
    <line x1="98" y1="315" x2="330" y2="280"/>
    <line x1="98" y1="325" x2="330" y2="360"/>
    <line x1="98" y1="335" x2="330" y2="430"/>
    <line x1="98" y1="345" x2="330" y2="500"/>
    <line x1="98" y1="355" x2="330" y2="570"/>
  </g>

  <!-- System associations: every use case except Register (no session exists yet to check) -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="802" y1="305" x2="570" y2="210"/>
    <line x1="802" y1="315" x2="570" y2="280"/>
    <line x1="802" y1="325" x2="570" y2="360"/>
    <line x1="802" y1="335" x2="570" y2="430"/>
    <line x1="802" y1="345" x2="570" y2="500"/>
    <line x1="802" y1="355" x2="570" y2="570"/>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#475569">
    <text x="30" y="595">User: initiates every action.</text>
    <text x="30" y="610">System: enforces the session/ownership check (WHERE UserID = ?) on every action except Register, where no session exists yet.</text>
  </g>
</svg>
